[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflows"
version = "0.0.0"
description = "Deterministic orchestration for LLM coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# The schemas are not documentation, they are what the validator validates
# against. A wheel without them installs a gate that cannot check anything.
[tool.setuptools.package-data]
workflows = ["contracts/*.schema.json"]
