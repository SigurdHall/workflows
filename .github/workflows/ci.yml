name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover --verbose

  # Proves the claim that a consuming repository can install this package and
  # run the validator in its own CI unchanged — installed, not PYTHONPATH-set.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m workflows.check plan.schema.json examples/plan.example.toml

  content-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CI checks the committed generic rules only. The private term list in
      # .content-policy.local.toml is gitignored, so the stricter local run is
      # the real gate against name leakage (ADR 0006).
      - run: python scripts/check_content_policy.py
