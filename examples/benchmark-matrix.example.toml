# A benchmark matrix: one cell per {model, effort, worker count} combination.
#
# Run it against a corpus with:
#     python -m workflows.benchmark run examples/corpus/tier-a/corpus.json \
#         --matrix examples/benchmark-matrix.example.toml \
#         --work-root <somewhere outside this repository> --dry-run
#
# The model names below are provider-unresolved role bindings, not literal
# model ids. A live run refuses them: a cell binds every role directly, so a
# real matrix names the model ids your runner serves. Copy this file and
# substitute them; `--profile` then supplies only what a cell does not name,
# per-role sandboxes above all.
#
# Keep the cells few and the differences deliberate — a matrix is an
# experiment, and every extra cell is a real cost with no hypothesis attached.
# Budgets are per cell (`--budget-tokens`), so a four-cell matrix can cost
# four times what one cell's budget allows.

[[cell]]
model = "worker-class"
effort = "medium"
worker_count = 1

[[cell]]
model = "worker-class"
effort = "high"
worker_count = 1

# Fan-out width is the variable the repository's "3-5 workers" default rests
# on. It is asserted, not measured, until a cell like this one measures it.
[[cell]]
model = "worker-class"
effort = "medium"
worker_count = 3

[[cell]]
model = "strongest-same-family"
effort = "high"
worker_count = 1
